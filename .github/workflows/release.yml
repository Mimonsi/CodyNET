name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact_suffix: windows-x64
            archive_ext: zip
          - rid: linux-x64
            artifact_suffix: linux-x64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CodyNET.Frontend/CodyNET.Frontend.csproj

      - name: Publish
        run: >-
          dotnet publish CodyNET.Frontend/CodyNET.Frontend.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Pack Windows artifact
        if: matrix.archive_ext == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../CodyNET-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.zip .

      - name: Pack Linux artifact
        if: matrix.archive_ext == 'tar.gz'
        run: |
          tar -czf CodyNET-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodyNET-${{ matrix.artifact_suffix }}
          path: |
            CodyNET-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.zip
            CodyNET-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.tar.gz

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            CodyNET-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.zip
            CodyNET-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.tar.gz
          generate_release_notes: true
