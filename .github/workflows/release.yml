name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact_suffix: windows-x64
            archive_ext: zip
          - rid: linux-x64
            artifact_suffix: linux-x64
            archive_ext: tar.gz

    env:
      ARCHIVE_NAME: CodyNET-${{ env.RELEASE_TAG }}-${{ matrix.artifact_suffix }}.${{ matrix.archive_ext }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "RELEASE_TAG is empty. For manual runs, set workflow input: release_tag."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CodyNET.Host/CodyNET.Host.csproj

      - name: Publish
        run: >-
          dotnet publish CodyNET.Host/CodyNET.Host.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Pack Windows artifact
        if: matrix.archive_ext == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../${ARCHIVE_NAME} .

      - name: Pack Linux artifact
        if: matrix.archive_ext == 'tar.gz'
        run: |
          tar -czf ${ARCHIVE_NAME} -C publish/${{ matrix.rid }} .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodyNET-${{ matrix.artifact_suffix }}-${{ env.RELEASE_TAG }}
          path: ${{ env.ARCHIVE_NAME }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Validate release tag
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "RELEASE_TAG is empty. For manual runs, set workflow input: release_tag."
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/**/*
          generate_release_notes: true