name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact_suffix: windows-x64
            archive_ext: zip
          - rid: linux-x64
            artifact_suffix: linux-x64
            archive_ext: tar.gz

    steps:
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release tag
        shell: bash
        run: |
          if [ -z "${{ steps.tag.outputs.tag }}" ]; then
            echo "Release tag is empty. For manual runs, set workflow input: release_tag."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CodyNET.Host/CodyNET.Host.csproj

      - name: Publish
        run: >-
          dotnet publish CodyNET.Host/CodyNET.Host.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Pack Windows artifact
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          ARCHIVE_NAME="CodyNET-${{ steps.tag.outputs.tag }}-${{ matrix.artifact_suffix }}.${{ matrix.archive_ext }}"
          cd publish/${{ matrix.rid }}
          zip -r "../../${ARCHIVE_NAME}" .
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Pack Linux artifact
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE_NAME="CodyNET-${{ steps.tag.outputs.tag }}-${{ matrix.artifact_suffix }}.${{ matrix.archive_ext }}"
          tar -czf "${ARCHIVE_NAME}" -C publish/${{ matrix.rid }} .
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodyNET-${{ matrix.artifact_suffix }}-${{ steps.tag.outputs.tag }}
          path: ${{ env.ARCHIVE_NAME }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release tag
        shell: bash
        run: |
          if [ -z "${{ steps.tag.outputs.tag }}" ]; then
            echo "Release tag is empty. For manual runs, set workflow input: release_tag."
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: release-assets/**/*
          generate_release_notes: true