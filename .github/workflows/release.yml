name: Build and Release

on:
  push:
    branches: [main]
    paths: ['version.json']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(jq -r '.version' version.json)
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if tag already exists
        id: check
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists, skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact_suffix: windows-x64
            archive_ext: zip
          - rid: linux-x64
            artifact_suffix: linux-x64
            archive_ext: tar.gz
          - rid: osx-arm64
            artifact_suffix: macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CodyNET.Host/CodyNET.Host.csproj

      - name: Publish
        run: >-
          dotnet publish CodyNET.Host/CodyNET.Host.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Pack Windows artifact
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          ARCHIVE_NAME="CodyNET-${TAG}-${{ matrix.artifact_suffix }}.${{ matrix.archive_ext }}"
          cd publish/${{ matrix.rid }}
          zip -r "../../${ARCHIVE_NAME}" .
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Pack Linux artifact
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          ARCHIVE_NAME="CodyNET-${TAG}-${{ matrix.artifact_suffix }}.${{ matrix.archive_ext }}"
          tar -czf "${ARCHIVE_NAME}" -C publish/${{ matrix.rid }} .
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodyNET-${{ matrix.artifact_suffix }}-${{ needs.prepare.outputs.tag }}
          path: ${{ env.ARCHIVE_NAME }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    if: needs.prepare.outputs.skip == 'false'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/**/*
          generate_release_notes: true
